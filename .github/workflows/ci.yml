name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even when an earlier one fails, so one run shows every failure.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      # Formatted once (VE-3926); fix with `pnpm format:fix`.
      - name: Formatting
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Parity tool tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:parity

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Only main saves the cache; pull requests reuse it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Each check runs even when an earlier one fails, so one run shows every failure.
      - name: Format
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --check

      # --locked: the release builds with --locked, so a stale Cargo.lock fails here first.
      - name: Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked

  cargo-deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Advisories on their own: a newly published advisory turns this check
        # red without any code change, and should not look like a licence problem.
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check
          command-arguments: ${{ matrix.checks }}
