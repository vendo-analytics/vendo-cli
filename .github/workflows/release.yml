name: Release vendo-cli

# Every cli-v* tag builds the CLI (Rust) for linux-x64, linux-arm64, darwin-arm64 and darwin-x64 and
# publishes a GitHub release with vendo-<target> and vendo-<target>.sha256 (VE-3669):
#   - cli-vX.Y.Z: a normal release that becomes "latest", which install.sh, `vendo update` and the
#     update notice install. Its notes are that version's section of CHANGELOG.md.
#   - cli-vX.Y.Z-rc.N: a pre-release that never becomes "latest", for testers.
# The release is created as a draft and published only once every binary is uploaded, so "latest"
# never points at a release with a binary missing (cli-v0.3.0 once shipped without darwin-x64).
on:
  push:
    tags:
      # The verify job rejects anything that is not cli-vX.Y.Z or cli-vX.Y.Z-rc.N.
      - 'cli-v*'

concurrency:
  group: release-vendo-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          elif [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            PRERELEASE=true
          else
            echo "::error::Release tags look like cli-vX.Y.Z or cli-vX.Y.Z-rc.N, got $GITHUB_REF_NAME"
            exit 1
          fi
          # Without --no-deps, --locked also fails if the bump commit left Cargo.lock behind.
          CARGO_VERSION="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "vendo") | .version')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test --locked

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Advisories, bans, licences and sources, with deny.toml, as CI checks them.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check

  release:
    name: Create draft release
    needs: [verify, cargo-deny]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Write release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            # A pre-release never becomes "latest", so the plain install command
            # would install the stable release. Point testers at this tag.
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          Release candidate. It never becomes "latest", so normal installs and updates don't get it.

          Install this release candidate:

          curl -fsSL https://app2.vendodata.com/install.sh | VENDO_VERSION=${GITHUB_REF_NAME} bash

          Or from an installed CLI: vendo update --version=${GITHUB_REF_NAME} (vendo self-update on 1.1.0-rc.3 or earlier, and on the TypeScript CLI)

          Staging: curl -fsSL https://stg.vendodata.com/install.sh | VENDO_VERSION=${GITHUB_REF_NAME} bash
          EOF
          else
            # This version's section of CHANGELOG.md: the lines after "## <version>" up to the next "## ".
            awk -v heading="## $VERSION" '
              $0 == heading || index($0, heading " ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
            if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changelog.md"; then
              echo "::error::CHANGELOG.md has no section for $VERSION (a line \"## $VERSION\")"
              exit 1
            fi
            {
              cat "$RUNNER_TEMP/changelog.md"
              cat <<'EOF'

          ## Install

          curl -fsSL https://app2.vendodata.com/install.sh | bash

          Update an installed CLI with `vendo update` (`vendo self-update` on the TypeScript CLI, 0.3.x).

          Staging: curl -fsSL https://stg.vendodata.com/install.sh | bash
          EOF
            } > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run keeps the release as it is (a published one stays published) and
            # refreshes its title and notes; the publish jobs replace its binaries.
            gh release edit "$GITHUB_REF_NAME" \
              --title "Vendo CLI $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "Vendo CLI $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}"
          fi

  publish:
    name: Build ${{ matrix.target }}
    needs: [verify, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Rust binary needs at least the glibc of the image it was built on,
          # so both Linux builds pin Ubuntu 24.04 (ubuntu-latest moves to 26).
          - target: linux-x64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - target: darwin-arm64
            runner: macos-14
            triple: aarch64-apple-darwin
            lipo-arch: arm64
          # No Intel runner: cross-compiled on Apple silicon.
          - target: darwin-x64
            runner: macos-14
            triple: x86_64-apple-darwin
            lipo-arch: x86_64
    env:
      ASSET: vendo-${{ matrix.target }}
      TRIPLE: ${{ matrix.triple }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      # The size of the group menu (VE-3826): build the binary without the menu (the `menu`
      # feature) and with it, and write both sizes and the difference to the run's summary. Over
      # 150,000 bytes is a warning, never a failure (Yalcin, 2026-10-06). The script builds the
      # menu last, so the next step finds the release binary up to date.
      - name: Check the menu's size
        run: scripts/menu-size.sh --target "$TRIPLE"

      - name: Build release binary
        run: cargo build --release --locked --target "$TRIPLE"

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/$TRIPLE/release/vendo" "dist/$ASSET"

      # Running a binary on macOS doesn't prove its architecture (Rosetta runs
      # x86_64 transparently), so check the Mach-O slice explicitly.
      - name: Check architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.lipo-arch }}
        run: |
          ACTUAL_ARCH="$(lipo -archs "dist/$ASSET")"
          echo "dist/$ASSET: $ACTUAL_ARCH"
          if [ "$ACTUAL_ARCH" != "$EXPECTED_ARCH" ]; then
            echo "::error::Expected a $EXPECTED_ARCH binary, got: $ACTUAL_ARCH"
            exit 1
          fi

      - name: Smoke test binary
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cmd=("./dist/$ASSET")
          if [ "$TRIPLE" = x86_64-apple-darwin ] && [ "$(uname -m)" = arm64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              cmd=(arch -x86_64 "./dist/$ASSET")
            else
              echo "::warning::Rosetta is not available on this runner, so $ASSET was checked by architecture only."
              exit 0
            fi
          fi

          out="$("${cmd[@]}" --version)"
          echo "--version: $out"
          # Like the TypeScript CLI, --version prints the bare version (VE-3727).
          if [ "$out" != "$VERSION" ]; then
            echo "::error::Expected --version to print '$VERSION', got '$out'"
            exit 1
          fi

          "${cmd[@]}" completions bash > "$RUNNER_TEMP/vendo.bash"
          if [ ! -s "$RUNNER_TEMP/vendo.bash" ]; then
            echo "::error::completions bash printed nothing"
            exit 1
          fi
          echo "completions bash: $(wc -c < "$RUNNER_TEMP/vendo.bash") bytes"

      # Same format as the TypeScript release: install.sh runs `sha256sum -c` on it.
      - name: Write checksum
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
            sha256sum -c "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
            shasum -a 256 -c "$ASSET.sha256"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/$ASSET" \
            "dist/$ASSET.sha256" \
            --clobber

  finalize:
    name: Publish the release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # Every binary and checksum must be there before the release goes public.
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            for name in "vendo-$target" "vendo-$target.sha256"; do
              if ! grep -qxF "$name" <<<"$assets"; then
                echo "::error::$GITHUB_REF_NAME has no $name"
                exit 1
              fi
            done
          done
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            # The release install.sh, `vendo update` and the update notice resolve (releases/latest).
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
