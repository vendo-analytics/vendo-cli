# cargo-deny policy for the Rust CLI (VE-3731). CI runs `cargo deny check` on
# every pull request; locally: `cargo install cargo-deny --locked`, then
# `cargo deny check` from `rust/`.

[graph]
# Only the platforms we publish binaries for, so crates used only on Windows,
# WASM or Android don't count.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# cargo-deny defaults: vulnerable, unmaintained and unsound crates fail the
# check; yanked versions only warn. Ignore an advisory only with a reason:
# { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not affect the CLI" }
ignore = []

[licenses]
# Only the licences the dependency graph needs. cargo-deny warns when an entry
# here stops being used; remove it then.
allow = [
    "Apache-2.0",
    "BSD-3-Clause", # subtle (via rustls); aws-lc-sys
    "ISC",          # rustls-webpki, untrusted, is_ci; aws-lc-rs, aws-lc-sys
    "MIT",
    "Unicode-3.0",  # unicode-ident; icu_* (via url → idna)
]
# No per-crate exceptions are needed today. Checked on 2026-10-05:
# - aws-lc-sys 0.45 needs ISC AND Apache-2.0 AND MIT AND BSD-3-Clause (no
#   OpenSSL licence any more); aws-lc-rs needs ISC.
# - ring is listed in Cargo.lock but no target builds it (`cargo tree -i ring
#   --target all` prints nothing), so cargo-deny never sees it.
# - webpki-root-certs (CDLA-Permissive-2.0) is only used on targets we don't
#   ship. If it ever appears, add a crate-only exception for it, not a global
#   allow.
exceptions = []

[bans]
# Duplicate versions (today: supports-color 2 and 3 via owo-colors) are
# reported, not failed.
multiple-versions = "warn"
deny = [
    # TLS is rustls, linked into the binary. OpenSSL would tie the Linux builds
    # to the host's libssl.
    { crate = "openssl-sys", reason = "use rustls: release binaries must not need the system OpenSSL" },
    { crate = "native-tls", reason = "use rustls: release binaries must not need the system OpenSSL" },
]

[sources]
# crates.io only: no other registries and no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
