[package]
name = "vendo"
# The Rust CLI's release version. A release-candidate tag cli-vX.Y.Z-rc.N must
# match it (release-rc.yml checks); ../package.json keeps the TypeScript CLI's
# version until the switch-over (VE-3669).
version = "1.0.0-rc.1"
edition = "2024"
description = "Vendo CLI — manage your data pipeline from the terminal"
license = "MIT"
publish = false

[[bin]]
name = "vendo"
path = "src/main.rs"

[features]
default = ["menu"]
# The arrow-key menu a group run without its command opens on a terminal (VE-3826). Built
# without it (`--no-default-features`), a bare group is the usage error at a terminal too, as
# without one. Each release checks that it adds at most 150 KB, 153,600 bytes (Yalcin, 2026-10-06):
# scripts/menu-size.sh builds both and compares, locally and in release-rc.yml for each target.
menu = ["dep:crossterm", "dep:inquire"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
# inquire's terminal library, at inquire's version (VE-3826): the group menu reads the screen size
# as inquire does and redraws itself after Ctrl-C as inquire draws. Part of the `menu` feature.
crossterm = { version = "0.29.0", default-features = false, optional = true }
fixed_decimal = { version = "0.7.2", features = ["ryu"] }
hyper = { version = "1.11.1", default-features = false }
icu_calendar = "2.3"
icu_datetime = "2.3"
icu_decimal = "2.3"
icu_locale_core = "2.3"
icu_locale_fallback = "2.3"
icu_time = "2.3"
indicatif = "0.18.6"
# The menu a group run without its command opens on a terminal (VE-3826). With the crossterm backend
# Esc, Ctrl-C and Ctrl-D arrive as keys (with console, Ctrl-C kills the process). No fuzzy matching:
# typing filters by substring. Part of the `menu` feature.
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"], optional = true }
jiff = "0.2.37"
open = "5.4.4"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
# arbitrary_precision: `--json` prints numbers exactly as the API sent them (VE-3728).
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "float_roundtrip", "preserve_order"] }
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "time", "signal"] }
uuid = { version = "1.27.0", features = ["v4"] }
writeable = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "macros", "rt"] }
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
